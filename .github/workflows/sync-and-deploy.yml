name: Upstream Sync and Deploy

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nodewarden-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shuaiplus/nodewarden.git || true
          git fetch upstream main
          git merge upstream/main -m "chore: sync upstream changes" || echo "No changes or merge failed"
          git push origin main || echo "Nothing to push"

  deploy:
    name: Build & Deploy
    needs: [sync]
    if: always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build webapp
        run: npm run build

      - name: Configure custom domain
        run: |
          if ! grep -q "warden.inory.eu.org" wrangler.toml; then
            cat <<'TOMLEOF' >> wrangler.toml

routes = [
  { pattern = "warden.inory.eu.org", custom_domain = true }
]
TOMLEOF
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Set JWT Secret
        if: env.JWT_SECRET != ''
        run: |
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
