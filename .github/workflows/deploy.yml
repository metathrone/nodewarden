name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build webapp
        run: npm run build

      - name: Configure custom domain
        run: |
          if ! grep -q "warden.inory.eu.org" wrangler.toml; then
            cat <<'TOMLEOF' >> wrangler.toml

routes = [
  { pattern = "warden.inory.eu.org", custom_domain = true }
]
TOMLEOF
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Upload JWT Secret
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            printf '%s' "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
